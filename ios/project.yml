name: mp2tv
options:
  bundleIdPrefix: com.mp2tv
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    GENERATE_INFOPLIST_FILE: NO
    MARKETING_VERSION: "0.3.0"
    CURRENT_PROJECT_VERSION: "3"

targets:
  mp2tv:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: mp2tv
      - path: shared
    info:
      path: mp2tv/Info.plist
      properties:
        CFBundleDisplayName: mp2tv
        UILaunchScreen_Generation: YES
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 扫描电脑端的配对二维码
        NSLocalNetworkUsageDescription: 在局域网内发现并连接电脑端进行投屏
        NSBonjourServices: [_mp2tv._tcp]
        UIBackgroundModes: [audio, screen-capture]
        NSSupportsLiveActivities: YES
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mp2tv.app
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic

  Mp2tvActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: activity
      - path: shared
    info:
      path: activity/Info.plist
      properties:
        CFBundleDisplayName: mp2tv 投屏
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mp2tv.app.activity
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
