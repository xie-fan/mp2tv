name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  windows:
    # 需要一台注册了 "windows" 标签的 act_runner（host 模式，跑在本机）
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install deps
        working-directory: windows
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: windows
        run: pnpm typecheck

      - name: Build
        working-directory: windows
        run: pnpm build

      - name: Package portable exe
        working-directory: windows
        run: pnpm dist

      - name: Upload windows build
        uses: actions/upload-artifact@v4
        with:
          name: mp2tv-windows
          path: |
            windows/out/
            windows/release/*.exe

  android:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        run: .\gradlew.bat assembleDebug
        env:
          ANDROID_HOME: C:\Users\xie_f\AppData\Local\Android\Sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp2tv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    # 仅 tag 推送时执行：下载两个构建产物，建 Release 并上传附件
    if: startsWith(github.ref, 'refs/tags/')
    needs: [windows, android]
    runs-on: windows
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mp2tv-windows
          path: dist-win
      - uses: actions/download-artifact@v4
        with:
          name: mp2tv-android-debug
          path: dist-android

      - name: Create release and upload assets
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
          API: ${{ github.server_url }}/api/v1
          TOKEN: ${{ secrets.GITEA_TOKEN }}
        run: |
          $headers = @{ Authorization = "token $env:TOKEN" }
          $body = @{ tag_name = $env:TAG; name = $env:TAG; target_commitish = 'main' } | ConvertTo-Json
          $rel = Invoke-RestMethod -Method Post -Uri "$env:API/repos/$env:REPO/releases" -Headers $headers -ContentType 'application/json' -Body $body
          Get-ChildItem dist-win -Filter *.exe | ForEach-Object {
            Invoke-RestMethod -Method Post -Uri "$env:API/repos/$env:REPO/releases/$($rel.id)/assets?name=$($_.Name)" -Headers $headers -InFile $_.FullName -ContentType 'application/octet-stream'
          }
          Get-ChildItem dist-android -Filter *.apk | ForEach-Object {
            Invoke-RestMethod -Method Post -Uri "$env:API/repos/$env:REPO/releases/$($rel.id)/assets?name=$($_.Name)" -Headers $headers -InFile $_.FullName -ContentType 'application/octet-stream'
          }
