name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  windows:
    # 需要一台注册了 "windows" 标签的 act_runner（host 模式，跑在本机）
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Enable pnpm
        run: corepack enable && corepack prepare pnpm@latest --activate

      - name: Install deps
        working-directory: windows
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: windows
        run: pnpm typecheck

      - name: Build
        working-directory: windows
        run: pnpm build

      - name: Package portable exe
        working-directory: windows
        run: pnpm dist

      - name: Upload windows build
        uses: actions/upload-artifact@v4
        with:
          name: mp2tv-windows
          path: |
            windows/out/
            windows/release/*.exe

  android:
    runs-on: windows
    steps:
      - uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build APK
        working-directory: android
        run: .\gradlew.bat assembleDebug
        env:
          ANDROID_HOME: C:\Users\xie_f\AppData\Local\Android\Sdk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mp2tv-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
