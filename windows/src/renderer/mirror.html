<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>mp2tv 投屏</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    html, body { width: 100%; height: 100%; background: #000; overflow: hidden; }
    body.hidecursor { cursor: none; }
    #stage { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; }
    canvas { display: block; max-width: 100%; max-height: 100%; }
    #bar {
      position: fixed; left: 50%; bottom: 32px; transform: translateX(-50%);
      display: flex; align-items: center; gap: 10px;
      background: rgba(20, 20, 24, 0.82); border-radius: 12px; padding: 10px 16px;
      transition: opacity 0.25s; opacity: 0; pointer-events: none;
    }
    #bar.show { opacity: 1; pointer-events: auto; }
    #bar .who { color: #ddd; font: 13px 'Microsoft YaHei', sans-serif; margin-right: 6px; }
    #bar button {
      padding: 6px 14px; border: none; border-radius: 8px; font-size: 13px;
      background: rgba(255, 255, 255, 0.14); color: #eee; cursor: pointer;
    }
    #bar button:hover { background: rgba(255, 255, 255, 0.28); }
    #bar button.on { background: #2563eb; color: #fff; }
    #overlay {
      position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
      background: rgba(0, 0, 0, 0.55); color: #eee;
      font: 16px 'Microsoft YaHei', sans-serif; z-index: 10;
    }
    #overlay.show { display: flex; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="screen"></canvas></div>
  <div id="bar">
    <span class="who" id="who"></span>
    <button id="btnMute">静音</button>
    <button id="btnMode">窗口模式</button>
    <button id="btnPin" style="display:none">置顶</button>
    <button id="btnStop">退出投屏</button>
  </div>
  <div id="overlay">连接中断，正在重连…</div>
  <script type="module" src="./mirror/index.ts"></script>
</body>
</html>
